name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    # A second, independent filter: it matches a pull request's *base*. Leaving
    # a branch out here means pull requests against it get no CI at all.
    branches: [master]
  workflow_dispatch:
    inputs:
      archive:
        description: 'Keep this build: publish it as a permanent release as well'
        type: boolean
        default: false
  schedule:
    # Once a month, so the monthly Tuxbox-OS image release can link a package
    # built from roughly the same source state instead of whatever was last
    # produced by hand. This is not the nightly the comment below argues
    # against: it fires with the release rhythm, not on its own.
    #
    # Ahead of the image build, which starts at 04:30 UTC, and deliberately
    # not on the hour - scheduled runs queue behind everyone else's, and a
    # few minutes of drift cost nothing here.
    - cron: '17 2 1 * *'
  # No schedule. It fires only from the default branch, so it never ran while
  # this file lived on dx; now that it sits on master it would wake up and
  # build nightly for no reason. A nightly worth having watches the Neutrino
  # and libstb-hal sources and builds when they move.

concurrency:
  # Keyed on the event as well as the ref. With one branch a push and a
  # workflow_dispatch carry the same github.ref, so keying on the ref alone
  # would let a one-line README push cancel a package build that runs for over
  # an hour -- cancellation happens here, at run level, and a job-level group
  # cannot prevent it.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Only the cheap triggers supersede themselves: a running dispatch or tag
  # build is never thrown away.
  #
  # A waiting one can be. GitHub holds at most one pending run per group, so a
  # third dispatch submitted while one runs and one waits replaces the waiting
  # one -- cancel-in-progress: false governs the running run, not the queue.
  # Dispatches are manual and rare, so the answer is to know this rather than to
  # build a queue around it: if the replaced run was the one asked to archive,
  # dispatch it again.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shell:
    name: Shell unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-shell

  deps:
    name: Deps preflight (${{ matrix.slug }})
    # Gated on the shell suite: it takes seconds and catches build-logic
    # breakage, so there is no point spinning up five distro containers behind
    # an already-failing tree.
    needs: shell
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12",     slug: "debian-12",     experimental: false }
          - { image: "debian:13",     slug: "debian-13",     experimental: false }
          - { image: "fedora:41",     slug: "fedora-41",     experimental: false }
          - { image: "ubuntu:22.04",  slug: "ubuntu-2204",   experimental: false }
          - { image: "ubuntu:24.04",  slug: "ubuntu-2404",   experimental: false }
    steps:
      - name: Install minimal bootstrap tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git make ca-certificates
          elif command -v dnf >/dev/null; then
            dnf install -y git make
          fi
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Capture dependency diagnostics
        run: make deps-doctor | tee "deps-doctor-${{ matrix.slug }}.txt"
      - name: Upload diagnostics for doc harvesting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-doctor-${{ matrix.slug }}
          path: deps-doctor-${{ matrix.slug }}.txt
      - name: Install declared dependencies
        run: make deps
      - name: Re-run shell unit tests on this release
        run: make test-shell

  build:
    name: Build (${{ matrix.slug }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12",     slug: "debian-12",     experimental: false }
          - { image: "fedora:41",     slug: "fedora-41",     experimental: false }
          - { image: "ubuntu:24.04",  slug: "ubuntu-2404",   experimental: false }
    steps:
      - name: Install minimal bootstrap tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git make ca-certificates
          elif command -v dnf >/dev/null; then
            dnf install -y git make
          fi
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            archive
          key: build-${{ matrix.slug }}-${{ hashFiles('make/**/*.mk', 'Makefile') }}
          restore-keys: |
            build-${{ matrix.slug }}-
      - name: Bootstrap (deps, ffmpeg, libstb-hal, neutrino)
        run: make bootstrap
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.slug }}
          path: |
            **/config.log
            logs/**
          if-no-files-found: ignore

  appimage:
    name: AppImage (build, package, verify)
    # Gated on the shell suite for the same reason as deps: this job takes the
    # better part of an hour and there is no point starting it behind a tree
    # that already fails in seconds.
    needs: shell
    # With ci-package gone and no tags published yet, workflow_dispatch is the
    # only way to a package. Any input added here must therefore not default to
    # switching this job off.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/')
    # Deliberately not a container job, unlike build above. The verification step
    # starts its own `docker run --privileged` to prove the package runs on a
    # machine that never built it, and a job that is itself a container has no
    # docker socket to do that with. Running on the runner host also puts the
    # AppRun mount namespace under the same conditions a user's machine offers.
    # The price is the runner's own glibc, so this measures whether the chain
    # works -- not yet how old a target the package can reach. Building in an
    # ubuntu:22.04 container to lower that floor is the next step, and needs the
    # artefact handed to a separate job for verification.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # No write permission here, deliberately. This job clones and executes
    # autogen.sh, configure scripts and Makefiles from two moving branch tips,
    # and actions/checkout leaves a push credential in .git/config -- a write
    # token in this job would put this repository's branches and tags within
    # reach of whatever those tips happen to contain. Publishing runs in a job
    # of its own, below, which executes none of that.
    outputs:
      archive_tag: ${{ steps.archive_tag.outputs.tag }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            archive
          key: appimage-${{ hashFiles('make/**/*.mk', 'Makefile') }}
          restore-keys: |
            appimage-
      - name: Report the ground this runs on
        run: |
          # sed, not head: head closes the pipe after the first line, ldd dies of
          # SIGPIPE and prints two "write error: Broken pipe" lines into the one
          # step whose purpose is to be readable. sed reads its input to the end.
          echo "glibc: $(ldd --version | sed -n 1p)"
          echo "unprivileged userns: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo 'no knob (allowed)')"
          unshare --user --map-root-user --mount --propagation private true \
            && echo "userns+mount namespace: usable" \
            || echo "userns+mount namespace: DENIED"
          df -h / | tail -n1
      # DEPS_ALLOW_SUDO because this job, unlike the container ones, does not run
      # as root: setup_deps.sh reports the missing packages instead of
      # installing them, which is right on a workstation and stops a runner
      # dead. Naming the packages here instead would duplicate a list that is
      # already maintained in one place.
      - name: Bootstrap (deps, ffmpeg, libstb-hal, neutrino)
        run: DEPS_ALLOW_SUDO=1 make bootstrap
      - name: Build the AppImage
        run: make package-appimage
      - name: Verify the AppImage
        run: make package-appimage-verify
      # Uploaded even when verification failed: the package is the evidence
      # needed to work out why, and rebuilding it locally takes an hour.
      - name: Upload the AppImage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: artifacts/appimage/*.AppImage
          if-no-files-found: warn
      # Named in this job, not in the publishing one: the tag carries the
      # libstb-hal commit, and libstb-hal exists only in this workspace -- the
      # publishing job checks nothing out on purpose. Run on every build rather
      # than only when archiving, so a name the script cannot form fails the
      # build that broke it instead of the first archive months later.
      - name: Name the archive tag
        id: archive_tag
        run: |
          tag="$(scripts/release_tag.sh "$GITHUB_SHA")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "archive tag for this build: $tag"
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-logs
          path: |
            **/config.log
            logs/**
          if-no-files-found: ignore

  publish:
    name: Publish the AppImage
    needs: appimage
    # workflow_dispatch lets the caller pick any ref, and the file being on the
    # default branch only decides whether the button appears -- not what it
    # runs. Without the branch test a dispatch from a feature branch would force
    # the public latest tag onto that commit and replace the assets of a release
    # whose notes say "of master".
    #
    # Tag pushes deliberately publish nothing yet: what a version number of this
    # repository should mean is still open, and a release hung on a tag would
    # answer that by accident. `needs` carries the rest -- a build that failed
    # verification never reaches this job, so nothing here has to ask for
    # success() by hand.
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # The reason this is a job of its own: it is the only place with a write
    # token, and it runs none of the code the build job clones. What it checks
    # out is this repository at the commit being published; the package arrives
    # as an artefact, and everything else is the GitHub API.
    #
    # A job that names permissions gets none of the ones it leaves out, so both
    # belong here: contents for the releases and the tag, actions for reading
    # the artefact back out of this run.
    permissions:
      contents: write
      actions: read
    steps:
      # persist-credentials: false because nothing here talks to git: gh
      # authenticates with GH_TOKEN, and a push credential left behind in
      # .git/config would only be one more thing that can leak. What is checked
      # out is this repository's own scripts at the commit being published --
      # the moving branch tips the build job clones never reach this job.
      # Pinned to commits, unlike everywhere else in this file, because this is
      # the job that holds a write token. `persist-credentials: false` keeps the
      # token out of .git/config, but checkout is still handed it, and a `v4`
      # tag is a moving target: whoever can retarget it runs code here with that
      # token. A full sha cannot be retargeted. Resolved 2026-08-20;
      # 11d5960 is checkout v4.4.0 and d3f86a1 is download-artifact v4.3.0.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Collect the built AppImage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: appimage
          path: artifacts/appimage
      # Checksummed here rather than carried over from the build, so the file
      # described is the file being published -- not one that looked the same
      # in another job.
      - name: Checksum the AppImage
        run: scripts/publish_release.sh checksum
      - name: Publish as the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_release.sh latest
      # Only when asked for. Archiving every run would turn the release list
      # into a build log, and the package name alone cannot tell two builds
      # apart -- scripts/release_tag.sh explains what the tag has to name.
      - name: Archive this build permanently
        # The monthly run archives by definition: it is the package the image
        # release points at, so it has to stay reachable after the next build
        # replaces the rolling latest.
        if: inputs.archive || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_TAG: ${{ needs.appimage.outputs.archive_tag }}
        run: scripts/publish_release.sh archive
